<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cardmarket Price Data | Hareruya Spyglass</title>
  <link rel="stylesheet" href="/static/styles.css?v=49">
</head>
<body>
  <main class="shell cardmarket-page">
    <header>
      <h1>Cardmarket Price Data</h1>
      <a class="top-data-link" href="/">Hareruya search ↗</a>
    </header>

    <section class="panel">
      <div class="cardmarket-view-tools">
        <div class="cardmarket-query-group">
          <div class="cardmarket-search-box">
            <input id="cardmarketQuery" type="search" placeholder="Search card name…" autocomplete="off" aria-autocomplete="list" aria-controls="cardmarketSuggestions" aria-expanded="false">
            <div id="cardmarketSuggestions" class="cardmarket-suggestions" role="listbox" hidden></div>
          </div>
          <label class="cardmarket-exact-option"><input id="cardmarketExact" type="checkbox"> Exact search only</label>
        </div>
        <input id="cardmarketExpansion" type="text" placeholder="Expansion, e.g. SOA">
        <button id="cardmarketSearch" type="button">Search</button>
      </div>
      <div class="cardmarket-local-meta"><div id="cardmarketTableStatus" class="cm-page-status">Enter search criteria and click Search.</div><div id="cardmarketFreshness" class="cm-page-status"></div></div>
      <div class="cardmarket-view-switch" role="group" aria-label="Result view">
        <button id="cardmarketTableView" class="cm-view-button" type="button" aria-pressed="false">Table</button>
        <button id="cardmarketGridView" class="cm-view-button active" type="button" aria-pressed="true">Grid</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Card</th>
            <th>Expansion</th>
            <th>Set name</th>
            <th>Prices</th>
            <th>Prices - Foil</th>
            <th>Cardmarket</th>
          </tr></thead>
          <tbody id="cardmarketTableBody"></tbody>
        </table>
      </div>
      <div id="cardmarketGrid" class="cm-card-grid" hidden></div>
      <div class="cm-pagination">
        <button id="cardmarketPrev" type="button">Previous</button>
        <span id="cardmarketPageStatus" class="cm-page-status"></span>
        <button id="cardmarketNext" type="button">Next</button>
      </div>
      <div id="cardmarketMobileLoadMore" class="cm-mobile-load-more" hidden aria-live="polite"></div>
    </section>
  </main>
  <script src="/static/cardmarket.js?v=50"></script>
</body>
</html>
